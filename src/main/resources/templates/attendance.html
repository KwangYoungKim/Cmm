<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주일 무인 출석</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 20px;}
        h1 { font-size: 3em; margin-bottom: 10px; }
        #video-container { position: relative; display: inline-block; margin-top: 20px; }
        video { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { position: absolute; top: 0; left: 0; }
        #status { margin-top: 20px; font-size: 1.5em; font-weight: bold; min-height: 40px; }
        .counter-badge { display: inline-block; background: linear-gradient(135deg, #16a085, #2ecc71); color: white; font-size: 1.5em; font-weight: bold; padding: 10px 25px; border-radius: 30px; margin-top: 15px; box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4); }
        .toast { position: fixed; top: 40px; right: 40px; background-color: #27ae60; color: white; padding: 30px 40px; border-radius: 15px; font-size: 2em; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 1000; font-weight: bold;}
        .admin-link-btn { color: #ecf0f1; background-color: #34495e; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #7f8c8d; transition: background 0.3s; }
        .admin-link-btn:hover { background-color: #4e6d8c; }
        .flip-btn { margin-top: 15px; padding: 10px 20px; font-size: 1em; background-color: #34495e; color: white; border: 1px solid #7f8c8d; border-radius: 8px; cursor: pointer; }
        .flip-btn:hover { background-color: #4e6d8c; }

        /* 미등록 교인 안내 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #34495e; padding: 30px 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 440px; width: 90%; color: white; animation: popIn 0.3s ease; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-icon { font-size: 3.5em; margin-bottom: 10px; }
        .modal-buttons { margin-top: 25px; display: flex; justify-content: center; gap: 15px; }
        .btn-cancel { padding: 12px 24px; font-size: 1.1em; background: #7f8c8d; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-cancel:hover { background: #95a5a6; }
        .btn-confirm { padding: 12px 24px; font-size: 1.1em; background: #e67e22; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); text-decoration: none; display: inline-block; }
        .btn-confirm:hover { background: #d35400; }
    </style>
</head>
<body>
    <h1>주일 예배 무인 출석</h1>
    <div class="counter-badge">오늘 출석 교인 수: <span id="todayCount">0</span>명</div>
    <div id="status">시스템 준비 중... 잠시만 기다려주세요.</div>
    <div id="video-container">
        <video id="video" width="800" height="600" autoplay muted></video>
    </div>
    <div>
        <button class="flip-btn" onclick="toggleFlip()">🔄 카메라 좌우 반전 전환</button>
    </div>
    
    <div id="toast" class="toast">출석 완료!</div>
    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
        <a href="/stats" class="admin-link-btn">📊 출석 통계 & 캘린더 대시보드</a>
        <a href="/members" class="admin-link-btn">👥 교인 명단 & 수정 관리</a>
        <a href="/register" class="admin-link-btn">👤 교인 얼굴 등록</a>
    </div>

    <!-- 미등록 교인/방문자 출석 및 등록 안내 모달 -->
    <div id="unregisteredModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-icon">✨</div>
            <h2 style="margin-top: 0; color: #f39c12;">미등록 교인 / 방문자 감지</h2>
            <p style="font-size: 1.1em; line-height: 1.5; color: #ecf0f1;">
                얼굴 정보가 등록되어 있지 않은 방문자입니다.<br>
                원하시는 작업을 선택해 주세요.
            </p>
            <div class="modal-buttons" style="flex-direction: column; gap: 10px;">
                <button class="btn-confirm" style="background: #27ae60;" onclick="checkVisitorAndClose()">✨ 방문자/새가족으로 출석 인정</button>
                <a href="/register" class="btn-confirm">👤 교인 얼굴 새로 등록하기</a>
                <button class="btn-cancel" onclick="closeUnregisteredModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const toastEl = document.getElementById('toast');
        const unregisteredModal = document.getElementById('unregisteredModal');
        const modelsUrl = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
        
        let faceMatcher = null;
        let isModalOpen = false;
        let lastUnknownPromptTime = 0;
        let consecutiveUnknownFrames = 0;
        let modalAutoCloseTimer = null;
        let toastTimeout = null;
        let lastAttendanceTime = {}; // 개별 교인 쿨다운 관리
        const pendingMemberIds = new Set(); // 현재 출석 요청 중인 memberId
        const memberNamesMap = {}; // ID -> 이름 매핑
        let isFlipped = localStorage.getItem('cameraFlipped') === 'true';
        const todayCountEl = document.getElementById('todayCount');

        let lastUnregisteredAttendanceTime = 0;
        let isUnregisteredProcessing = false;

        function showUnregisteredModal() {
            isModalOpen = true;
            lastUnknownPromptTime = Date.now();
            if (unregisteredModal) {
                unregisteredModal.style.display = 'flex';
            }
            statusEl.style.color = '#f39c12';
            statusEl.innerHTML = "미등록 교인/방문자 감지. <a href='/register' style='color:#e67e22;'>[얼굴 등록]</a>";

            if (modalAutoCloseTimer) clearTimeout(modalAutoCloseTimer);
            modalAutoCloseTimer = setTimeout(() => {
                closeUnregisteredModal();
            }, 6000);
        }

        async function checkVisitorAndClose() {
            closeUnregisteredModal();
            await markUnregisteredAttendance();
        }

        async function markUnregisteredAttendance() {
            if (isUnregisteredProcessing) return;
            const now = Date.now();
            if (now - lastUnregisteredAttendanceTime < 10000) return;

            isUnregisteredProcessing = true;
            lastUnregisteredAttendanceTime = now;

            try {
                const response = await fetch('/api/attendance/check-unregistered', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast("✨ " + result.message, '#e67e22');
                    if (result.todayCount !== undefined) {
                        todayCountEl.innerText = result.todayCount;
                    } else {
                        fetchTodayCount();
                    }
                }
            } catch(e) {
                console.error("미등록 출석 오류:", e);
            } finally {
                setTimeout(() => {
                    isUnregisteredProcessing = false;
                }, 3000);
            }
        }

        function closeUnregisteredModal() {
            if (modalAutoCloseTimer) clearTimeout(modalAutoCloseTimer);
            isModalOpen = false;
            if (unregisteredModal) {
                unregisteredModal.style.display = 'none';
            }
            statusEl.style.color = 'white';
            statusEl.innerText = "카메라를 정면으로 바라봐 주세요.";
        }

        async function fetchTodayCount() {
            try {
                const res = await fetch('/api/attendance/today-count');
                const data = await res.json();
                if (data.count !== undefined) {
                    todayCountEl.innerText = data.count;
                }
            } catch (e) {
                console.error("당일 출석 인원 조회 오류:", e);
            }
        }

        function applyFlip() {
            const transformVal = isFlipped ? 'scaleX(-1)' : 'none';
            video.style.transform = transformVal;
            const canvas = document.querySelector('#video-container canvas');
            if (canvas) {
                canvas.style.transform = 'none'; // 캔버스 글자 뒤집힘 방지
            }
        }

        function toggleFlip() {
            isFlipped = !isFlipped;
            localStorage.setItem('cameraFlipped', isFlipped);
            applyFlip();
        }

        async function init() {
            applyFlip();
            fetchTodayCount();
            try {
                statusEl.innerText = "인공지능 모델을 불러오는 중...";
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(modelsUrl),
                    faceapi.nets.faceLandmark68Net.loadFromUri(modelsUrl),
                    faceapi.nets.faceRecognitionNet.loadFromUri(modelsUrl)
                ]);
                
                statusEl.innerText = "교인 데이터를 불러오는 중...";
                const response = await fetch('/api/members');
                const members = await response.json();
                
                if (members.length === 0) {
                    statusEl.innerText = "등록된 교인이 없습니다. 먼저 얼굴을 등록해주세요.";
                    return;
                }

                const labeledDescriptors = members.map(member => {
                    memberNamesMap[member.id.toString()] = member.name;
                    const parsed = JSON.parse(member.faceDescriptor);
                    let float32Arrays = [];

                    if (Array.isArray(parsed) && parsed.length > 0) {
                        if (Array.isArray(parsed[0])) {
                            // 다각도(Multi-pose) 3포즈 복수 벡터
                            float32Arrays = parsed.map(arr => new Float32Array(arr));
                        } else {
                            // 단일(Single-pose) 벡터
                            float32Arrays = [new Float32Array(parsed)];
                        }
                    }
                    return new faceapi.LabeledFaceDescriptors(member.id.toString(), float32Arrays);
                });

                // 인지 정확도를 높이기 위해 임계값을 0.45로 엄격하게 적용하여 미등록자 오인식 차단
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45); 
                
                startVideo();
            } catch(e) {
                statusEl.innerText = "초기화 오류: " + e;
            }
        }

        const memberMatchFrameCount = {}; // 연속 매칭 프레임 카운터

        function startVideo() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusEl.style.color = '#e74c3c';
                statusEl.innerHTML = "⚠️ <b>카메라 접근 제한</b><br>HTTP IP 접속(예: 192.168.x.x) 시 브라우저 보안 정책으로 카메라가 차단됩니다.<br><a href='http://localhost:8081/attendance' style='color:#f1c40f; text-decoration:underline;'>http://localhost:8081</a> 로 접속하거나 Chrome 설정(flags)을 변경해 주세요.";
                return;
            }

            navigator.mediaDevices.getUserMedia({ video: { width: 800, height: 600 } })
                .then(stream => {
                    video.srcObject = stream;
                    applyFlip();
                    statusEl.style.color = 'white';
                    statusEl.innerText = "카메라를 정면으로 바라봐 주세요.";
                })
                .catch(err => {
                    console.error("카메라 접근 오류:", err);
                    statusEl.style.color = '#e74c3c';
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        statusEl.innerHTML = "🚫 <b>카메라 권한이 거부되었습니다</b><br>브라우저 주소창 왼쪽 🔒(자물쇠) 또는 설정 아이콘 ➔ <b>카메라 권한을 '허용'</b>으로 변경 후 새로고침(F5) 해주세요.";
                    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                        statusEl.innerHTML = "🔌 <b>카메라(웹캠)를 찾을 수 없습니다</b><br>PC에 웹캠이 연결되어 있는지 확인해 주세요.";
                    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                        statusEl.innerHTML = "📷 <b>카메라가 이미 사용 중입니다</b><br>Zoom, Teams, 줌/화상회의 등 다른 프로그램에서 카메라를 끄고 새로고침 해주세요.";
                    } else {
                        statusEl.innerHTML = "⚠️ 카메라 접근 실패: " + err.name + " (" + err.message + ")";
                    }
                });
        }

        video.addEventListener('play', () => {
            const canvas = faceapi.createCanvasFromMedia(video);
            document.getElementById('video-container').append(canvas);
            applyFlip();
            const displaySize = { width: video.width, height: video.height };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!faceMatcher || isModalOpen) return;

                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 다중인원 박스 및 교인 이름 표시
                resizedDetections.forEach(detection => {
                    const b = detection.detection ? detection.detection.box : detection.box;
                    const bestMatch = faceMatcher ? faceMatcher.findBestMatch(detection.descriptor) : null;
                    
                    const x = isFlipped ? (displaySize.width - b.x - b.width) : b.x;
                    const y = b.y;
                    const width = b.width;
                    const height = b.height;

                    const isKnown = bestMatch && bestMatch.label !== 'unknown';
                    const labelText = isKnown ? (memberNamesMap[bestMatch.label] || "등록교인") : "미등록";

                    // 알려진 교인은 초록색(#2ecc71), 미등록 교인은 주황색(#e67e22) 박스
                    ctx.strokeStyle = isKnown ? '#2ecc71' : '#e67e22';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, width, height);

                    ctx.font = 'bold 16px sans-serif';
                    const textWidth = ctx.measureText(labelText).width;
                    const textY = y > 26 ? y - 26 : y;

                    ctx.fillStyle = isKnown ? '#2ecc71' : '#e67e22';
                    ctx.fillRect(x, textY, textWidth + 14, 24);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(labelText, x + 7, textY + 17);
                });

                if (detections.length > 0) {
                    let hasKnownFace = false;
                    for (const detection of detections) {
                        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                        
                        if (bestMatch.label !== 'unknown') {
                            const memberId = parseInt(bestMatch.label);
                            memberMatchFrameCount[memberId] = (memberMatchFrameCount[memberId] || 0) + 1;

                            // 최소 2 프레임 연속 교인으로 정확히 감지되었을 때만 출석 처리 (단발성 오인식 완벽 방지)
                            if (memberMatchFrameCount[memberId] >= 2) {
                                hasKnownFace = true;
                                consecutiveUnknownFrames = 0;
                                const now = Date.now();

                                // 개별 교인 단위 쿨다운(10초) 및 비동기 중복 처리 방지
                                if (!lastAttendanceTime[memberId] || (now - lastAttendanceTime[memberId] > 10000)) {
                                    if (!pendingMemberIds.has(memberId)) {
                                        markAttendance(memberId);
                                    }
                                }
                            }
                        }
                    }

                    // 감지된 사람 중 등록 교인이 없는 경우 미등록 안내 처리
                    if (!hasKnownFace) {
                        consecutiveUnknownFrames++;
                        const now = Date.now();
                        if (consecutiveUnknownFrames >= 8 && (now - lastUnknownPromptTime > 12000)) {
                            showUnregisteredModal();
                            consecutiveUnknownFrames = 0;
                        }
                    } else {
                        consecutiveUnknownFrames = 0;
                    }
                } else {
                    consecutiveUnknownFrames = 0;
                }
            }, 500);
        });

        async function markAttendance(memberId) {
            if (pendingMemberIds.has(memberId)) return;
            pendingMemberIds.add(memberId);

            try {
                const response = await fetch('/api/attendance/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ memberId: memberId })
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast(result.message, '#27ae60');
                    lastAttendanceTime[memberId] = Date.now();
                    if (result.todayCount !== undefined) {
                        todayCountEl.innerText = result.todayCount;
                    } else {
                        fetchTodayCount();
                    }
                } else if (result.alreadyChecked) {
                    showToast(result.message, '#e67e22');
                    lastAttendanceTime[memberId] = Date.now();
                    if (result.todayCount !== undefined) {
                        todayCountEl.innerText = result.todayCount;
                    }
                } else {
                    console.error("출석 실패:", result.message);
                }
            } catch(e) {
                console.error("서버 연동 오류:", e);
            } finally {
                setTimeout(() => {
                    pendingMemberIds.delete(memberId);
                }, 3000);
            }
        }

        function showToast(message, bgColor = '#27ae60') {
            toastEl.innerText = message;
            toastEl.style.backgroundColor = bgColor;
            toastEl.style.display = 'block';
            statusEl.innerText = message;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.style.display = 'none';
                statusEl.innerText = "다음 분, 카메라를 정면으로 바라봐 주세요.";
            }, 3500);
        }

        window.onload = init;
    </script>
</body>
</html>
